<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A Bible study set on Verdance</title>
  <meta name="description" content="Someone shared a Bible study flashcard set with you on Verdance — study it with flashcards, spaced repetition, and quizzes." />
  <meta name="theme-color" content="#6366F1" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="A Bible study set on Verdance 📖" />
  <meta property="og:description" content="Study this set with flashcards, spaced repetition and quizzes — grow in the Word with Verdance." />
  <meta property="og:image" content="https://getverdance.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --indigo:#6366F1; --violet:#8B5CF6; --ink:#1E1B2E; --muted:#6B6880; --card:#FFFFFF; --line:#ECEBF5; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter,system-ui,sans-serif; color:var(--ink); background:#F7F6FD;
           min-height:100vh; -webkit-font-smoothing:antialiased; }
    .hero { background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff;
            padding:48px 20px 64px; text-align:center; }
    .brand { font-weight:800; font-size:18px; letter-spacing:.3px; opacity:.95; }
    .wrap { max-width:560px; margin:-40px auto 0; padding:0 16px 56px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:20px;
             box-shadow:0 18px 40px rgba(99,102,241,.12); padding:28px 22px; }
    h1 { font-size:24px; font-weight:800; line-height:1.25; }
    .by { color:var(--muted); font-size:14px; margin-top:6px; }
    .count { display:inline-block; margin-top:14px; font-size:13px; font-weight:600; color:var(--indigo);
             background:#EEF0FF; border-radius:999px; padding:6px 14px; }
    .cards { margin-top:22px; display:flex; flex-direction:column; gap:12px; }
    .qa { border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:#FCFCFF; }
    .q { font-weight:700; font-size:15px; }
    .a { color:var(--muted); font-size:14px; margin-top:6px; }
    .cta { display:block; text-align:center; margin-top:26px; background:var(--indigo); color:#fff;
           text-decoration:none; font-weight:700; font-size:16px; padding:15px; border-radius:14px;
           box-shadow:0 10px 24px rgba(99,102,241,.35); }
    .sub { text-align:center; color:var(--muted); font-size:13px; margin-top:14px; }
    .sub a { color:var(--indigo); font-weight:600; text-decoration:none; }
    .state { text-align:center; color:var(--muted); padding:40px 10px; font-size:15px; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:8px 0 40px; }
    footer a { color:var(--muted); }
  </style>
</head>
<body>
  <div class="hero"><div class="brand">🌿 Verdance</div></div>
  <div class="wrap">
    <div class="panel" id="panel">
      <div class="state" id="state">Loading set…</div>
    </div>
    <div class="sub">New here? <a href="https://getverdance.com/">Grow in the Word with Verdance →</a></div>
  </div>
  <footer><a href="https://getverdance.com/">getverdance.com</a></footer>

  <script>
    var API = 'https://api.getverdance.com/api/v1/sets/shared/';
    // id from ?id= or trailing path segment (/s/<id>) if Caddy is ever pathed.
    var params = new URLSearchParams(location.search);
    var id = params.get('id') || location.pathname.split('/').filter(Boolean).pop();
    var state = document.getElementById('state');
    var panel = document.getElementById('panel');

    function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

    if (!id || id === 's.html') {
      state.textContent = 'No set specified.';
    } else {
      fetch(API + encodeURIComponent(id))
        .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
        .then(function(res){
          var s = res.data;
          if (!s) throw new Error('empty');
          document.title = s.title + ' — Verdance';
          var cards = (s.cards || []).map(function(c){
            return '<div class="qa"><div class="q">'+esc(c.question)+'</div><div class="a">'+esc(c.answer)+'</div></div>';
          }).join('');
          var more = s._count && s._count.cards > (s.cards||[]).length
            ? '<div class="sub">+ '+ (s._count.cards - (s.cards||[]).length) +' more cards in the app</div>' : '';
          panel.innerHTML =
            '<h1>'+esc(s.title)+'</h1>' +
            (s.user && s.user.name ? '<div class="by">Shared by '+esc(s.user.name)+'</div>' : '') +
            (s._count ? '<div class="count">'+ s._count.cards +' flashcards</div>' : '') +
            (s.description ? '<div class="a" style="margin-top:14px">'+esc(s.description)+'</div>' : '') +
            '<div class="cards">'+cards+'</div>' + more +
            '<a class="cta" href="https://getverdance.com/">Get Verdance to study this set</a>';
        })
        .catch(function(){
          panel.innerHTML = '<div class="state">This set isn\'t available.<br><br>' +
            '<a class="cta" href="https://getverdance.com/">Discover Verdance →</a></div>';
        });
    }
  </script>
</body>
</html>
