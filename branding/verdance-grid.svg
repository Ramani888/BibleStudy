    <circle cx="452" cy="513" r="177"/>
    <circle cx="572" cy="513" r="177"/>
    <circle cx="512" cy="531" r="330" opacity="0.6"/>
    <line x1="512" y1="120" x2="512" y2="900" opacity="0.6"/>
    <line x1="180" y1="372" x2="844" y2="372" opacity="0.6"/>
    <line x1="180" y1="690" x2="844" y2="690" opacity="0.6"/>
  </g>

  <!-- the mark on top of its grid -->
  <path d="M360 372 L512 690 L664 372" stroke="#FFFFFF" stroke-width="40"
